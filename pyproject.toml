[project]
name = "fastapi-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "noorullah", email = "noorultracodes@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "sqlmodel>=0.0.47",
    "torch",
]

[project.scripts]
fastapi-blog = "fastapi_blog:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { path = "wheels/torch-2.5.1+cpu-cp312-cp312-win_amd64.whl" }

